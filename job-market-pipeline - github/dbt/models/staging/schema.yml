version: 2

models:
  - name: stg_hackernews_stories
    description: Cleaned Hacker News stories, one row per story.
    columns:
      - name: story_id
        description: Hacker News item ID.
        tests:
          - unique
          - not_null
      - name: posted_at
        description: When the story was posted.
        tests:
          - not_null

  - name: stg_job_enrichment
    description: >
      What the AI read out of each posting. The AI is treated like any other
      untrusted source, so its output gets tested. There is deliberately NO
      "job_id must exist in stg_remoteok_jobs" test, because this table
      keeps jobs that have since closed.
    columns:
      - name: job_id
        tests:
          - unique
          - not_null
      - name: seniority
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['intern', 'junior', 'mid', 'senior', 'lead', 'unknown']
      - name: open_to_nigeria
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['yes', 'no', 'unclear']
      - name: summary
        tests:
          - not_null

  - name: stg_remoteok_jobs
    description: >
      Current snapshot of matching RemoteOK listings. Full history of
      what opened/closed lives in the remoteok_jobs_snapshot instead —
      this model only reflects "right now".
    columns:
      - name: job_id
        description: RemoteOK job ID.
        tests:
          - unique
          - not_null
      - name: job_title
        tests:
          - not_null
